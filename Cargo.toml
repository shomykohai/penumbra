[workspace]
resolver = "3"
members = [
    "core",
    "core/penumbra-macros",
    "tui",
    "gui"
]
default-members = ["tui"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Shomy <git@itssho.my>"]
homepage = "https://penumbra.itssho.my"
repository = "https://github.com/shomykohai/penumbra"

[profile.dev]
opt-level = 0
debug = true
lto = false
codegen-units = 16

[profile.nightly]
inherits = "release"
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
strip = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false

[profile.bench]
inherits = "release"
debug = true
