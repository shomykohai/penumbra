[package]
name = "antumbra"
version = "2.0.0"
edition.workspace = true
authors = ["Shomy <git@itssho.my>"]
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "A TUI and CLI for interacting with MediaTek based devices."

[dependencies]
ratatui = { version = "0.29.0", optional = true }
penumbra = { path = "../core", package = "penumbra-mtk", default-features = false, features = ["libusb", "localslakeyring", "exploits"] }
env_logger = "0.11.8"
ratatui-explorer = { version = "0.2.1", optional = true }
ratatui-textarea = { version = "0.9.2", optional = true }
log = "0.4.28"
hex = "0.4.3"
strum_macros = "0.27.2"
derive_builder = "0.20.2"
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
indicatif = { version = "0.18.2" }
anyhow = "1.0.100"
colored = "3.0.0"
human_bytes = "0.4.3"
rand = "0.9.2"
unicode-width = "0.2.0"
clap-num = "1.2.0"
dirs = "6.0.0"
config = "0.15.19"
toml = "0.9.10"
ureq = { version = "3.3.0", features = ["json"] }
url = "2.5.8"
chrono = "0.4.45"

[target.'cfg(windows)'.dependencies]
cli-or-gui = { version = "0.1.1", optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "android")))'.dependencies]
penumbra = { path = "../core", package = "penumbra-mtk", features = ["nusb", "serial"] }

[[bin]]
name = "antumbra"
path = "src/main.rs"

[features]
default = ["tui"]
tui = [
    "ratatui",
    "ratatui-explorer",
    "ratatui-textarea",
    "dep:cli-or-gui",
]

[build-dependencies]
winresource = "0.1.30"
